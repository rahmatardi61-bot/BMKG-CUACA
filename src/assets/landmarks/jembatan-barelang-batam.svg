      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="btPylon" x1="0%" y1="0%" x2="100%" y2="0%">
